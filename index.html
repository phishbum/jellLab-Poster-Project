<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good Times</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 64px;
      margin: 0 0 10px;
    }

    h2 {
      font-weight: normal;
      color: #ccc;
      margin-bottom: 35px;
    }

    p {
      max-width: 650px;
      font-size: 20px;
      line-height: 1.6;
      color: #ddd;
    }

    button {
      margin-top: 30px;
      padding: 16px 30px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>GOOD TIMES</h1>

    <h2>Your show. Your memory. Your poster.</h2>

    <p>
      Turn an unforgettable concert into custom artwork.
      Choose a show, tell us what made it special, and create
      a poster inspired by the night you never want to forget.
    </p>

    <button onclick="alert('Poster creator coming next!')">
      Create Your Poster
    </button>
  </section>

</body>
</html>
