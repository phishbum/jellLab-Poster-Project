async function startCheckout(event){if(event)event.preventDefault();if(checkoutPending||!finalArtwork)return;const link=document.getElementById('checkout-link'),title=document.getElementById('review-title'),copy=document.getElementById('review-copy');checkoutPending=true;link.classList.add('checkout-working');link.setAttribute('aria-busy','true');link.textContent='Opening secure checkout…';try{const response=await fetch('/api/create-checkout-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerName:document.getElementById('customer-name').value.trim(),customerEmail:document.getElementById('customer-email').value.trim(),format:currentFormat,size:currentSize,finalArtwork,poster:{artist:val('artist',''),date:val('date',''),venue:val('venue',''),city:val('city',''),song:val('song',''),style:currentStyle,layout:currentLayout}})});const payload=await response.json();if(!response.ok)throw new Error(payload.error||'Secure checkout could not be opened.');window.location.assign(payload.checkoutUrl)}catch(error){title.textContent='Checkout needs another try.';copy.textContent=error.message;link.textContent='Try secure checkout again';link.classList.remove('checkout-working');link.removeAttribute('aria-busy');checkoutPending=false}}
function money(cents,currency){return new Intl.NumberFormat('en-US',{style:'currency',currency:(currency||'usd').toUpperCase()}).format(Number(cents||0)/100)}
const checkoutConfirmation=document.createElement('dialog');checkoutConfirmation.className='checkout-confirmation';checkoutConfirmation.id='checkout-confirmation';checkoutConfirmation.setAttribute('aria-labelledby','confirmation-title');checkoutConfirmation.innerHTML='<div class="confirmation-shell"><div class="confirmation-mark" id="confirmation-mark">✓</div><div class="kicker" id="confirmation-kicker">Order confirmation</div><h2 id="confirmation-title" style="margin:9px 0 12px;font-size:36px">Checking your payment…</h2><p id="confirmation-copy" style="margin:0;color:#bbb5ca;line-height:1.65">Stripe is securely confirming your order.</p><div class="confirmation-detail" id="confirmation-detail" hidden><div><span>Order</span><strong id="confirmation-number"></strong></div><div><span>Total</span><strong id="confirmation-total"></strong></div><div><span>Format</span><strong id="confirmation-format"></strong></div><div><span>Size</span><strong id="confirmation-size"></strong></div></div><div class="confirmation-actions"><a class="btn primary" id="confirmation-download" href="#" hidden>Download print master</a><button class="btn secondary" type="button" onclick="document.getElementById(\'checkout-confirmation\').close()">Close</button></div></div>';document.body.appendChild(checkoutConfirmation);
async function loadCheckoutConfirmation(sessionId,attempt){const title=document.getElementById('confirmation-title'),copy=document.getElementById('confirmation-copy'),mark=document.getElementById('confirmation-mark');try{const response=await fetch('/api/order-status?session_id='+encodeURIComponent(sessionId),{headers:{'Accept':'application/json'}}),payload=await response.json();if(!response.ok)throw new Error(payload.error||'Your confirmation could not be loaded.');const order=payload.order;document.getElementById('confirmation-detail').hidden=false;document.getElementById('confirmation-number').textContent=order.number;document.getElementById('confirmation-total').textContent=money(order.amountTotal,order.currency);document.getElementById('confirmation-format').textContent=order.format;document.getElementById('confirmation-size').textContent=order.size;if(order.paid){title.textContent='Your poster is officially yours.';copy.textContent='Payment confirmed. Your exact approved print master is attached to order '+order.number+'.';mark.textContent='✓';const download=document.getElementById('confirmation-download');download.href=order.downloadUrl;download.hidden=false;download.textContent='Download print master'}else if(attempt<3){title.textContent='Payment received.';copy.textContent='Stripe is finishing the confirmation. This usually takes only a moment…';setTimeout(()=>loadCheckoutConfirmation(sessionId,attempt+1),1800)}else{title.textContent='Confirmation is still processing.';copy.textContent='Your order is saved. Refresh this page in a moment and we will check it again.'}}catch(error){mark.textContent='!';title.textContent='We could not load the confirmation.';copy.textContent=error.message;copy.classList.add('confirmation-error')}}
function handleCheckoutReturn(){const params=new URLSearchParams(location.search),state=params.get('checkout');if(state==='success'){const sessionId=params.get('session_id');checkoutConfirmation.showModal();if(sessionId)loadCheckoutConfirmation(sessionId,0);else{document.getElementById('confirmation-title').textContent='That confirmation link is incomplete.';document.getElementById('confirmation-copy').textContent='Please use the return link from Stripe.'}}else if(state==='cancelled'){document.getElementById('order').classList.add('active');setProgress(3);const card=document.getElementById('review-card');card.classList.add('active');document.getElementById('review-title').textContent='No problem—your order was not placed.';document.getElementById('review-copy').textContent='Your approved poster is still here whenever you are ready.';document.getElementById('checkout-link').style.display='none'}}
const checkoutLink=document.getElementById('checkout-link');checkoutLink.href='#';checkoutLink.setAttribute('role','button');checkoutLink.addEventListener('click',startCheckout);document.querySelector('#order .section-head p').textContent='Choose a format, review the exact approved poster, and continue to secure Stripe checkout.';document.querySelector('.privacy-note').innerHTML='Your name, email, order choices, and exact print master are saved securely only when you continue to checkout.<div class="checkout-security">Payment details are entered on Stripe and never touch this site.</div>';checkoutLink.textContent='Continue to secure checkout';
loadDraft();setProgress(1);
loadPermanentProject();
handleCheckoutReturn();
</script>
